worker_processes 1;

# Peer address and TLS failures have to reach `docker logs`. A log file inside
# the container is invisible without a shell on the VM, and an aborted handshake
# never produces an access-log line at all: only error_log shows it. `info` is
# what makes "SSL_do_handshake() failed ... client: <ip>" and "client prematurely
# closed connection ... client: <ip>" appear, which is exactly the evidence a
# failed phone connection leaves behind.
error_log /dev/stderr info;
pid /var/run/nginx.pid;
events { worker_connections 256; }
http {
  # One line per completed request, naming the TCP peer nginx actually saw.
  # $ssl_* is "-" on the plain-HTTP listener. `client_verify` is SUCCESS, NONE or
  # FAILED:<reason>, so a certificate the phone offered but that did not verify is
  # visible without logging the certificate itself.
  log_format edge '$time_iso8601 listener=$server_port peer=$remote_addr '
    'host=$host uri="$request" status=$status bytes=$body_bytes_sent '
    'tls=$ssl_protocol cipher=$ssl_cipher sni=$ssl_server_name '
    'client_verify=$ssl_client_verify rt=$request_time';
  access_log /dev/stdout edge;
  client_max_body_size 1m;
  proxy_buffer_size 16k;
  proxy_buffers 4 16k;
  large_client_header_buffers 4 16k;

  # A client may send a request over a connection it kept open and then wait.
  # These bounds apply to that socket regardless of what the upstream is doing.
  keepalive_timeout 30s;
  client_header_timeout 15s;
  client_body_timeout 20s;
  send_timeout 25s;

  # ---------------------------------------------------------------------------
  # THIS FILE IS A TEMPLATE. server.mjs renders it to /etc/nginx/nginx.conf at
  # start-up, substituting EDGE_HOSTNAME for the two placeholders below, because
  # nginx cannot read an environment variable.
  #
  # The edge must answer on exactly the names it was configured with. Before this,
  # the single TLS server answered every SNI and every Host it was handed, so
  # https://<machine-ip>/ completed a handshake, showed a certificate-name warning
  # and then served the app. That address is not the site: it was only ever a
  # reachability test, and the warning it produces reads as a broken deployment.
  # ---------------------------------------------------------------------------
  # A configured name is far longer than nginx's default bucket. Both the name
  # map and the server-name table fail the whole config ("could not build ...")
  # when a single entry does not fit, so both are sized up once here.
  map_hash_bucket_size 128;
  server_names_hash_bucket_size 128;
  map $host $edge_host_known {
    default 0;
__EDGE_HOST_MAP_ENTRIES__
  }

  server {
    listen 80;
    # Any configured name may answer the HTTP-01 challenge, so a certificate
    # renewal for the custom domain does not depend on the Azure label.
    server_name _;
    # A challenge token is an unguessable path, so answering it on every name
    # costs nothing and keeps a renewal working while DNS is mid-change.
    location /.well-known/acme-challenge/ {
      default_type text/plain;
      alias /var/lib/edge-certs/.well-known/acme-challenge/;
    }
    # Reachability diagnostic, answered before the redirect to TLS. A device that
    # can open this has working name resolution and a route to this VM, which the
    # HTTPS page cannot distinguish from a gate or certificate refusal. It is
    # handled by the edge itself and never proxied, so no API state, credential
    # or certificate is involved. Deliberately above `location /`, because the
    # redirect would hide the one thing this is here to show.
    location = /edge-http-ping {
      proxy_pass http://127.0.0.1:8080;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Edge-Ip $remote_addr;
      proxy_set_header X-Edge-Port $server_port;
      proxy_set_header X-Edge-Cert "";
      proxy_set_header Connection "close";
      proxy_connect_timeout 5s;
      proxy_send_timeout 10s;
      proxy_read_timeout 10s;
      proxy_next_upstream off;
    }
    # Everything else is upgraded only for a configured name. A bare address or a
    # stray Host is closed without a response (`444`), so the address that is not
    # the site cannot hand a browser a redirect into a handshake that refuses it.
    location / {
      if ($edge_host_known = 0) {
        return 444;
      }
      return 301 https://$host$request_uri;
    }
  }

  # Default TLS server: matches any SNI that is not a configured name, plus any
  # client that sent no SNI at all — which is exactly what a browser does for an
  # address literal. The handshake is refused, so no session is negotiated, there
  # is no certificate to mismatch and no client-certificate prompt. Reaching the
  # edge by address therefore fails to connect instead of warning that the
  # certificate belongs to a different name.
  #
  # A client can also handshake under a configured SNI and then send a different
  # Host. nginx re-selects a virtual server on that Host, lands here, and — with
  # no `return` — answered from the package's default document root, which served
  # nginx's stock welcome page on the site's own HTTPS port. The explicit refusal
  # removes that page; this block must never have content.
  server {
    listen 443 ssl default_server;
    ssl_reject_handshake on;
    return 444;
  }

  server {
    listen 443 ssl;
    # The configured name, and only the configured name. The certificate carries
    # every name in the list; the name the visitor used travels on as Host.
    server_name __EDGE_SERVER_NAME__;

    ssl_certificate /var/lib/edge-certs/fullchain.pem;
    ssl_certificate_key /var/lib/edge-certs/privkey.pem;
    # advertise the device CA so a browser with the identity can offer it
    ssl_client_certificate /var/lib/edge-certs/ca.crt;
    ssl_verify_client optional;
    ssl_verify_depth 1;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:EdgeSSL:2m;
    ssl_session_timeout 10m;

    # TLS-only diagnostic. Requires no certificate, no device identity and no
    # API availability, so a success here separates "TLS and the hostname work
    # on this device" from "the access gate lets this device in". Answered by the
    # edge, never proxied, and it exposes nothing about the app.
    location = /edge-ping {
      proxy_pass http://127.0.0.1:8080;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Edge-Ip $remote_addr;
      proxy_set_header X-Edge-Port $server_port;
      proxy_set_header X-Edge-Cert "";
      proxy_set_header Connection "close";
      proxy_connect_timeout 5s;
      proxy_send_timeout 10s;
      proxy_read_timeout 10s;
      proxy_next_upstream off;
    }
    # The same plain-HTTP page, reachable over TLS. A phone that follows an
    # auto-upgrade to https still gets the diagnostic instead of the gate.
    location = /edge-http-ping {
      proxy_pass http://127.0.0.1:8080;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Edge-Ip $remote_addr;
      proxy_set_header X-Edge-Port $server_port;
      proxy_set_header X-Edge-Cert "";
      proxy_set_header Connection "close";
      proxy_connect_timeout 5s;
      proxy_send_timeout 10s;
      proxy_read_timeout 10s;
      proxy_next_upstream off;
    }

    location / {
      # A request can complete TLS under a configured SNI and then ask for a
      # different Host. Only a configured name is ever proxied, so the address
      # form cannot be reached by that route either.
      if ($edge_host_known = 0) {
        return 444;
      }
      proxy_pass http://127.0.0.1:8080;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      # TCP peer only. This edge terminates TLS on the VM itself, so $remote_addr
      # is the visitor's own socket address. X-Forwarded-For is whatever the
      # client wrote inside TLS, so it is not a substitute for $remote_addr.
      proxy_set_header X-Edge-Ip $remote_addr;
      proxy_set_header X-Edge-Cert $ssl_client_escaped_cert;
      # Attestation headers are this edge's own statement. A client can type any
      # header inside TLS, so every copy it sent is cleared before the proxy
      # writes the real ones.
      proxy_set_header X-Ledger-Client-Ip "";
      proxy_set_header X-Ledger-Ip-Mac "";
      proxy_set_header X-Ledger-Client-Cert "";
      proxy_set_header X-Ledger-Cert-Mac "";
      # One connection per request, closed after the response. A pooled loopback
      # connection that either side retired produced a request written into a
      # dead socket: TLS connected, then zero bytes until the browser gave up.
      # A fresh connection costs microseconds and cannot stall.
      proxy_set_header Connection "close";
      proxy_connect_timeout 5s;
      proxy_send_timeout 25s;
      proxy_read_timeout 25s;
      proxy_buffering on;
      proxy_ignore_client_abort on;
      proxy_next_upstream off;
    }
  }
}
