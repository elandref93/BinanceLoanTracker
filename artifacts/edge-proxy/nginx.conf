worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;
events { worker_connections 128; }
http {
  access_log off;
  client_max_body_size 1m;
  proxy_buffer_size 16k;
  proxy_buffers 4 16k;
  large_client_header_buffers 4 16k;
  server {
    listen 80;
    location /.well-known/acme-challenge/ {
      default_type text/plain;
      alias /var/lib/edge-certs/.well-known/acme-challenge/;
    }
    location / {
      return 301 https://$host$request_uri;
    }
  }
  server {
    listen 443 ssl;
    ssl_certificate /var/lib/edge-certs/fullchain.pem;
    ssl_certificate_key /var/lib/edge-certs/privkey.pem;
    ssl_client_certificate /var/lib/edge-certs/ca.crt;
    ssl_verify_client optional;
    ssl_verify_depth 1;
    ssl_protocols TLSv1.2 TLSv1.3;
    location / {
      proxy_pass http://127.0.0.1:8080;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      # TCP peer only. This edge terminates TLS on the VM itself, so $remote_addr
      # is the visitor's own socket address. X-Forwarded-For is whatever the
      # client wrote inside TLS, so it is not a substitute for $remote_addr.
      proxy_set_header X-Edge-Ip $remote_addr;
      proxy_set_header X-Edge-Cert $ssl_client_escaped_cert;
      proxy_set_header Connection "";
      proxy_read_timeout 60s;
    }
  }
}
