<!doctype html>
<html lang="en-ZA">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#06090C" />
    <title>Ledger is offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: #06090c;
        color: #e8eef2;
        font-family: system-ui, sans-serif;
      }
      main { max-width: 28rem; padding: 2rem; }
      h1 { font-size: 1.4rem; margin: 0 0 0.5rem; }
      p { color: #8a9ba8; line-height: 1.5; }
      button {
        margin-top: 1.25rem;
        min-height: 2.75rem;
        padding: 0 1rem;
        border: 0;
        border-radius: 14px;
        background: #00f0ff;
        color: #06090c;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>Ledger needs a connection to load your accounts. Figures are never stored in this browser.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
